<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apex Rotation" />
    <meta
      name="description"
      content="See the current Apex Legends pubs and ranked map rotation, the countdown, and what is coming next."
    />
    <title>Apex Map Rotation</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Apex Legends</p>
          <h1>Map rotation</h1>
        </div>
        <div class="live-mark" aria-label="Live schedule">
          <span aria-hidden="true"></span>
          Live
        </div>
      </header>

      <nav class="mode-switcher" aria-label="Game mode">
        <button class="mode-button is-active" type="button" data-mode="pubs" aria-pressed="true">
          Pubs
        </button>
        <button class="mode-button" type="button" data-mode="ranked" aria-pressed="false">
          Ranked
        </button>
      </nav>

      <section class="hero-card" aria-labelledby="current-map-label">
        <div class="hero-topline">
          <p id="current-map-label">On now</p>
          <p id="mode-duration">90 min rotation</p>
        </div>
        <h2 id="current-map">Storm Point</h2>
        <div class="countdown-block">
          <p>Changes in</p>
          <time id="countdown" aria-live="off">--:--:--</time>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>
        <p class="window" id="current-window">Calculating local time…</p>
      </section>

      <section class="up-next" aria-labelledby="up-next-title">
        <div class="section-heading">
          <h2 id="up-next-title">Up next</h2>
          <p id="timezone-label">Your local time</p>
        </div>
        <ol id="next-list" class="next-list"></ol>
      </section>

      <footer>
        <p id="schedule-note">Schedule anchored in Pacific Time and shown in your local time.</p>
        <p>Last updated: <time datetime="2026-08-11">August 11, 2026</time></p>
      </footer>
    </main>

    <noscript>This page needs JavaScript to calculate the live rotation.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
